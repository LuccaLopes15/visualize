<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Visualize</title>
    <!--
      Everything is local ('self'). Additions for the Excalidraw board:
      img-src blob: (image cache / exports), font-src for its bundled fonts
      (excalidraw-assets/, see electron.vite.config.ts), worker-src 'self' for
      its font-subsetting worker and 'wasm-unsafe-eval' (WebAssembly only, no
      JS eval) for the subsetting/woff2 code used when exporting.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' data: blob:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
